name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RecDiffy.NET/RecDiffy.slnx

      - name: Build
        run: dotnet build RecDiffy.NET/RecDiffy.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test RecDiffy.NET/src/RecDiffy.Tests/RecDiffy.Tests.csproj -c Release --no-build --no-restore

      - name: Test file readers
        run: dotnet test RecDiffy.NET/src/RecDiffy.IO.Tests/RecDiffy.IO.Tests.csproj -c Release --no-build --no-restore

      - name: Read the version from the tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "Tag '$tag' must be a prerelease, vX.Y.Z-label, for example v1.2.0-preview.1. Every release is a prerelease for now."
            exit 1
          fi
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack RecDiffy.NET/src/RecDiffy/RecDiffy.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.RulePacks.Trading/RecDiffy.RulePacks.Trading.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.Excel/RecDiffy.Excel.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.IO/RecDiffy.IO.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      # #296: the files pushed to nuget.org are the files these checks see. Both scripts read the packages from
      # RecDiffy.NET/tests/PackageSmoke/feed, so copy them there first, and let either script fail the job before
      # anything is pushed. The checks are the ones packages.yml runs on each pull request.
      - name: Put the packed files in the package smoke feed
        run: |
          feed=RecDiffy.NET/tests/PackageSmoke/feed
          rm -rf "$feed"
          mkdir -p "$feed"
          cp artifacts/*.nupkg "$feed/"
          echo "The feed holds:"
          ls "$feed"

      - name: Consume the packed files as a consumer gets them
        run: bash RecDiffy.NET/tests/PackageSmoke/consume.sh "$VERSION"

      - name: Publish the packed files with Native AOT and with trimming
        run: bash RecDiffy.NET/tests/PackageSmoke/publish-aot.sh "$VERSION"

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg --title "$TAG" --generate-notes --prerelease
