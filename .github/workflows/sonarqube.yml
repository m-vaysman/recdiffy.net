# Self-hosted SonarQube Community Build analysis.
# Skips cleanly when SONAR_TOKEN / SONAR_HOST_URL secrets are absent (no server yet).
# Stock Community Build analyzes the main branch only (no PR/branch analysis without
# a matching community branch plugin). Prefer push-to-main or workflow_dispatch for
# uploads until a 26.11-compatible plugin exists. See issue #101.
name: SonarQube

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analyze
    runs-on: ubuntu-latest
    # Fork PRs without secrets should not fail the suite.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: RecDiffy.NET
    steps:
      - name: Check Sonar secrets
        id: secrets
        working-directory: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN and/or SONAR_HOST_URL not set; skipping SonarQube analysis."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: RecDiffy.NET/global.json

      - name: Set up JDK 21
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache SonarQube packages
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Cache NuGet packages
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install SonarScanner
        if: steps.secrets.outputs.configured == 'true'
        working-directory: .
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Add Coverlet collector (CI workspace only)
        if: steps.secrets.outputs.configured == 'true'
        working-directory: .
        run: |
          dotnet add RecDiffy.NET/src/RecDiffy.Tests/RecDiffy.Tests.csproj package coverlet.collector --version 6.0.4
          dotnet add RecDiffy.NET/src/RecDiffy.Excel.Tests/RecDiffy.Excel.Tests.csproj package coverlet.collector --version 6.0.4

      - name: Begin SonarQube analysis
        if: steps.secrets.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Do not set sonar.branch.name / sonar.pullrequest.* here.
          # Stock Community Build only accepts main-branch analysis (no branch plugin for 26.11 yet).
          # workflow_dispatch and push-to-main succeed; PR / push-to-dev may be rejected by the server.
          dotnet sonarscanner begin \
            /k:"m-vaysman_recdiffy.net" \
            /n:"RecDiffy.NET" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /s:"$GITHUB_WORKSPACE/RecDiffy.NET/SonarQube.Analysis.xml" \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/RecDiffy.NET/TestResults/**/coverage.opencover.xml" \
            /d:sonar.dotnet.excludeTestProjects=true

      - name: Restore
        if: steps.secrets.outputs.configured == 'true'
        run: dotnet restore RecDiffy.slnx

      - name: Build
        if: steps.secrets.outputs.configured == 'true'
        # Do not pass -warnaserror here: the scanner begin step disables WarningsAsErrors.
        run: dotnet build RecDiffy.slnx -c Release --no-restore --no-incremental

      - name: Install LibreOffice
        if: steps.secrets.outputs.configured == 'true'
        working-directory: .
        # Healthy installs finish in well under a minute. This only stops a
        # stalled mirror from holding the job open.
        timeout-minutes: 4
        run: |
          # Calc only. libreoffice-base-core depends on
          # "libreoffice-core | libreoffice-core-nogui", so installing
          # libreoffice-calc-nogui alone pulls the larger GUI core.
          pkgs="libreoffice-core-nogui libreoffice-calc-nogui"
          # ubuntu-latest tries azure.archive.ubuntu.com first. A mirror that
          # trickles the debs never trips apt's idle timeout, so this step can
          # sit for many minutes (actions/runner-images#14823). Bound it and
          # retry from the next mirror.
          drop_azure_mirror() {
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            fi
          }
          if ! timeout --kill-after=15 45 sudo apt-get update; then
            drop_azure_mirror
            sudo apt-get update
          fi
          if ! timeout --kill-after=15 90 sudo apt-get install -y --no-install-recommends --download-only $pkgs; then
            drop_azure_mirror
            sleep 2
            sudo apt-get install -y --no-install-recommends --download-only $pkgs
          fi
          sudo apt-get install -y --no-install-recommends $pkgs
          command -v soffice

      - name: Test with OpenCover coverage
        if: steps.secrets.outputs.configured == 'true'
        run: |
          dotnet test src/RecDiffy.Tests/RecDiffy.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults
          dotnet test src/RecDiffy.Excel.Tests/RecDiffy.Excel.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults

      - name: End SonarQube analysis
        if: steps.secrets.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
