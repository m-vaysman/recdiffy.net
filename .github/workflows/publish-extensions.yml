name: Publish Extensions

# Packs and publishes RecDiffy.Extensions on its own, when you run it: Actions > Publish Extensions > Run workflow.
# The version is its own: a prerelease, X.Y.Z-label, or a stable release, X.Y.Z. The package declares no dependencies,
# so this does not touch the four packages that release.yml publishes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of RecDiffy.Extensions: X.Y.Z-label for a prerelease, for example 0.1.0-preview.4, or X.Y.Z for a stable release"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-extensions
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the branch and the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Run this workflow from main or dev, not from $GITHUB_REF."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Version '$VERSION' must be X.Y.Z-label for a prerelease, for example 0.1.0-preview.4, or X.Y.Z for a stable release."
            exit 1
          fi
          if [[ "$VERSION" != *-* && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Publish a stable version from main, not from $GITHUB_REF."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RecDiffy.NET/src/RecDiffy.Extensions.Tests/RecDiffy.Extensions.Tests.csproj

      - name: Build
        run: dotnet build RecDiffy.NET/src/RecDiffy.Extensions.Tests/RecDiffy.Extensions.Tests.csproj -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test RecDiffy.NET/src/RecDiffy.Extensions.Tests/RecDiffy.Extensions.Tests.csproj -c Release --no-build --no-restore

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack RecDiffy.NET/src/RecDiffy.Extensions/RecDiffy.Extensions.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:AllowStableVersion=true -p:ContinuousIntegrationBuild=true

      - name: Check that the package declares no dependencies
        run: |
          if unzip -p "artifacts/RecDiffy.Extensions.$VERSION.nupkg" RecDiffy.Extensions.nuspec | grep -q '<dependency '; then
            echo "::error::RecDiffy.Extensions declares a dependency. It must declare none."
            exit 1
          fi

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
