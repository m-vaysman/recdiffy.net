name: Excel add-in

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'RecDiffy.ExcelAddIn/**'
      - '.github/workflows/excel-addin.yml'
  push:
    branches: [main, dev]
    paths:
      - 'RecDiffy.ExcelAddIn/**'
      - '.github/workflows/excel-addin.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTALLER_VERSION: 0.1.${{ github.run_number }}

jobs:
  # Routing for this workflow. build is Windows-only work, so it falls back to
  # windows-latest. publish was on ubuntu-latest and keeps ubuntu-latest as its own
  # fallback, so each job preserves the hosted image it has today.
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    with:
      hosted_fallback: windows-latest

  pick-runner-linux:
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    with:
      hosted_fallback: ubuntu-latest

  # Self-hosted first. This job is Windows-only either way (net10.0-windows and a WiX
  # MSI), and every step is dotnet against the solution, so a Windows runner runs the
  # same build, the same tests and the same installer. Nothing here needs a Linux tool.
  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on_json) }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: RecDiffy.ExcelAddIn/global.json

      - name: Restore
        run: dotnet restore RecDiffy.ExcelAddIn/RecDiffy.ExcelAddIn.slnx

      - name: Build
        run: dotnet build RecDiffy.ExcelAddIn/RecDiffy.ExcelAddIn.slnx -c Release --no-restore -warnaserror -p:InstallerVersion=${{ env.INSTALLER_VERSION }}

      - name: Test
        run: dotnet test RecDiffy.ExcelAddIn/RecDiffy.ExcelAddIn.slnx -c Release --no-build

      - name: Upload the packed add-ins
        uses: actions/upload-artifact@v4
        with:
          name: recdiffy-excel-addin
          path: RecDiffy.ExcelAddIn/src/RecDiffy.ExcelAddIn/bin/Release/net10.0-windows/publish/*-packed.xll
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: recdiffy-excel-addin-installer
          path: RecDiffy.ExcelAddIn/src/RecDiffy.ExcelAddIn.Installer/bin/Release/RecDiffy.ExcelAddIn.msi
          if-no-files-found: error

  # Self-hosted first, with its own pick so its fallback stays ubuntu-latest. The one
  # run step is bash and says so, so it is the same script with the same
  # ${GITHUB_SHA::7} and gh calls on either machine; gh is already on COBBLER1, which
  # the capacity harness uses. It runs only on a push to main, never on a pull request,
  # and it waits for the pick so it never races the pick it reads.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, pick-runner-linux]
    runs-on: ${{ fromJSON(needs.pick-runner-linux.outputs.runs_on_json) }}
    permissions:
      contents: write
    concurrency:
      group: excel-addin-release
      cancel-in-progress: false

    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: recdiffy-excel-addin-installer
          path: installer

      - name: Publish it to the excel-addin release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Version $INSTALLER_VERSION of the RecDiffy Excel add-in installer, built from ${GITHUB_SHA::7} on main. It's replaced each time the add-in changes on main. It isn't signed yet, so Windows asks before it runs it. To install it, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/main/RecDiffy.ExcelAddIn#install"
          if gh release view excel-addin > /dev/null 2>&1; then
            gh release upload excel-addin installer/RecDiffy.ExcelAddIn.msi --clobber
            gh release edit excel-addin --notes "$notes"
          else
            gh release create excel-addin installer/RecDiffy.ExcelAddIn.msi --target "$GITHUB_SHA" --prerelease --title "RecDiffy Excel add-in" --notes "$notes"
          fi
