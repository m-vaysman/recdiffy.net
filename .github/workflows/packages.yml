name: Packages

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  # Routing for the jobs that may run on the Windows self-hosted runner. The jobs
  # that name ubuntu-latest below cannot, and each says why.
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    with:
      hosted_fallback: ubuntu-latest

  # Hosted-only. The packing checks are bash: the step after the pack uses [[ ]],
  # arrays and compgen, verify-sourcelink.sh needs unzip and python3, and the Source
  # Link check runs a bash script. A stock Windows runner has none of unzip or
  # python3, so this job cannot run there without rewriting what it checks.
  pack:
    name: "Pack (#86, #52)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: RecDiffy.NET
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Source Link stamps the commit it built from into each PDB, so it needs the commit, not just a working tree.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Restore cached NuGet packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install the Source Link tool
        run: dotnet tool install --global sourcelink
        working-directory: .

      - name: Pack the whole solution
        run: dotnet pack RecDiffy.slnx -c Release -o ../artifacts/packages -warnaserror -p:Version="$VERSION"

      - name: Check that only the four libraries were packed
        working-directory: artifacts/packages
        run: |
          expected="RecDiffy RecDiffy.Excel RecDiffy.IO RecDiffy.RulePacks.Trading"
          status=0
          for kind in nupkg snupkg; do
            actual=$(for file in *."$kind"; do echo "${file%."$VERSION.$kind"}"; done | sort | xargs)
            echo "$kind: $actual"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Packing the solution made these .$kind files: $actual. Expected exactly: $expected."
              status=1
            fi
          done
          exit "$status"

      - name: Check that each symbol package finds the source at this commit (#49)
        working-directory: .
        run: |
          export DOTNET_ROOT="${DOTNET_ROOT:-$HOME/.dotnet}"
          export PATH="$HOME/.dotnet/tools:$PATH"
          bash RecDiffy.NET/tests/PackageSmoke/verify-sourcelink.sh artifacts/packages "$VERSION"

      - name: Check that the typed-reconciliation sample builds and packs nothing
        run: |
          sample=../docs/typed-reconciliation/sample/TypedReconciliationSample.csproj
          dotnet build "$sample" -c Release
          dotnet pack "$sample" -c Release --no-build -o "$RUNNER_TEMP/typed-sample" -p:Version="$VERSION"
          if compgen -G "$RUNNER_TEMP/typed-sample/*.nupkg" > /dev/null; then
            echo "::error::The typed-reconciliation sample made a package: $(ls "$RUNNER_TEMP/typed-sample")"
            exit 1
          fi

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 7

  # Hosted-only. consume.sh captures a sample's console output and compares it exactly:
  # `engine=$(... | grep -F "engine version: ")`, then `[[ $engine == "$version" ]]`.
  # On Windows that output ends a line with CRLF, and command substitution strips only
  # the LF, so $engine keeps a trailing \r and the check fails for every package. Fixing
  # it means changing what the script compares, so this job stays where it runs today.
  consumer:
    name: Consume the packages (#50)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Download the packages into the local feed
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: RecDiffy.NET/tests/PackageSmoke/feed

      - name: Restore from the feed, check the packages and run the samples
        run: bash RecDiffy.NET/tests/PackageSmoke/consume.sh "$VERSION"

  # Hosted-only. publish-aot.sh is bash and publishes with --use-current-runtime, so
  # on a Windows runner it would build win-x64 Native AOT and need the Visual Studio
  # C++ toolchain. That is a different build from the linux-x64 one this check makes.
  aot-packages:
    name: Native AOT and trimming from the packages (#51)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Download the packages into the local feed
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: RecDiffy.NET/tests/PackageSmoke/feed

      - name: Publish with Native AOT and with trimming, then run
        run: bash RecDiffy.NET/tests/PackageSmoke/publish-aot.sh "$VERSION"

  # Hosted-only. Publishes -r linux-x64 with Native AOT, which needs clang and runs
  # the binary at a Linux path. Windows needs clang, a Windows SDK and the Visual
  # Studio C++ tools, so it cannot build or run this check as written.
  aot-host:
    name: Native AOT host (#51)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: RecDiffy.NET
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Restore cached NuGet packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish RecDiffy.AotHost with Native AOT
        run: >-
          dotnet publish src/RecDiffy.AotHost/RecDiffy.AotHost.csproj -c Release -r linux-x64
          -o "$RUNNER_TEMP/aot-host" -warnaserror -p:TreatWarningsAsErrors=true -p:TrimmerSingleWarn=false

      - name: Run RecDiffy.AotHost
        run: |
          exact=$("$RUNNER_TEMP/aot-host/RecDiffy.AotHost")
          echo "Exact matches: $exact"
          [[ "$exact" == "1" ]]

  # Self-hosted first. Every step is plain dotnet against RecDiffy.Samples: build, then
  # run. The samples write to Path.GetTempPath(), so no Linux path is involved, and a
  # sample that reads a value differently returns false and fails the job rather than
  # passing quietly.
  # Caveat: the sample profiles declare no culture, so the machine culture reads their
  # ASCII decimals and ISO dates. ubuntu-latest reads them as invariant and COBBLER1 as
  # en-US, which agree for this data. A non-English Windows locale would not.
  samples:
    name: Run the samples (#62)
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on_json) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: RecDiffy.NET
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Restore cached NuGet packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the samples
        run: dotnet build src/RecDiffy.Samples/RecDiffy.Samples.csproj -c Release -warnaserror

      - name: Run the samples
        run: dotnet run --project src/RecDiffy.Samples/RecDiffy.Samples.csproj -c Release --no-build
