name: CodeQL

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  schedule:
    # Weekly, so code that has not changed since the last run still gets new queries.
    - cron: "0 6 * * 1"

# Top level grants read only. The analyze job adds security-events: write, which
# is what lets CodeQL upload its results to code scanning.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: RecDiffy.NET/global.json

      # Manual, not autobuild: the solution is RecDiffy.NET/RecDiffy.slnx, one folder
      # down, and autobuild looks for it at the root. The commands match ci.yml.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the solution for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          dotnet restore RecDiffy.NET/RecDiffy.slnx
          dotnet build RecDiffy.NET/RecDiffy.slnx -c Release --no-restore -warnaserror

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
