name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: RecDiffy.NET/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RecDiffy.NET/RecDiffy.slnx

      - name: Build
        run: dotnet build RecDiffy.NET/RecDiffy.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test RecDiffy.NET/src/RecDiffy.Tests/RecDiffy.Tests.csproj -c Release --no-build --no-restore

      - name: Test file readers
        run: dotnet test RecDiffy.NET/src/RecDiffy.IO.Tests/RecDiffy.IO.Tests.csproj -c Release --no-build --no-restore

      - name: Install LibreOffice
        uses: ./.github/actions/install-libreoffice
        timeout-minutes: 4

      - name: Test Excel reports
        run: dotnet test RecDiffy.NET/src/RecDiffy.Excel.Tests/RecDiffy.Excel.Tests.csproj -c Release --no-build --no-restore

      - name: Pack prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: 1.1.0-preview.${{ github.run_number }}
        run: |
          mkdir -p artifacts
          dotnet pack RecDiffy.NET/src/RecDiffy/RecDiffy.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.RulePacks.Trading/RecDiffy.RulePacks.Trading.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.Excel/RecDiffy.Excel.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.IO/RecDiffy.IO.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Upload packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-prerelease
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          dotnet nuget push "artifacts/*.nupkg" --source github --api-key "$GITHUB_TOKEN" --skip-duplicate
