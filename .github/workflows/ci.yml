name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RecDiffy.NET/RecDiffy.slnx

      - name: Build
        run: dotnet build RecDiffy.NET/RecDiffy.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test RecDiffy.NET/src/RecDiffy.Tests/RecDiffy.Tests.csproj -c Release --no-build --no-restore

      - name: Test file readers
        run: dotnet test RecDiffy.NET/src/RecDiffy.IO.Tests/RecDiffy.IO.Tests.csproj -c Release --no-build --no-restore

      - name: Install LibreOffice
        uses: ./.github/actions/install-libreoffice
        timeout-minutes: 4

      - name: Test Excel reports
        run: dotnet test RecDiffy.NET/src/RecDiffy.Excel.Tests/RecDiffy.Excel.Tests.csproj -c Release --no-build --no-restore

      # Allure Docker Service, not TestOps. The upload must not fail this job.
      # Fork pull requests are skipped: Actions does not provide these secrets.
      # Same-repo pull requests, and pushes to dev and main, publish project recdiffy.
      - name: Publish Allure report
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          ALLURE_SERVER_URL: ${{ secrets.ALLURE_SERVER_URL }}
          ALLURE_USER: ${{ secrets.ALLURE_USER }}
          ALLURE_PASSWORD: ${{ secrets.ALLURE_PASSWORD }}
          ALLURE_PROJECT_ID: recdiffy
          ALLURE_EXECUTION_NAME: "${{ github.event_name == 'pull_request' && format('PR #{0} {1}', github.event.pull_request.number, github.sha) || format('{0} {1}', github.ref_name, github.sha) }}"
          ALLURE_EXECUTION_FROM: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/publish_allure.py

      - name: Pack prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: 1.1.0-preview.${{ github.run_number }}
        run: |
          mkdir -p artifacts
          dotnet pack RecDiffy.NET/src/RecDiffy/RecDiffy.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.RulePacks.Trading/RecDiffy.RulePacks.Trading.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.Excel/RecDiffy.Excel.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack RecDiffy.NET/src/RecDiffy.IO/RecDiffy.IO.csproj -c Release -o artifacts --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Upload packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-prerelease
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
