# Continuous benchmarks on the dedicated COBBLER1 runner.
# No pull_request or pull_request_target: this repo is public and the runner
# is self-hosted, so untrusted fork code must never execute on COBBLER1.
# Push to dev/main and workflow_dispatch only.
#
# Bencher CLI 0.6.x (installed on the runner, not in this job):
# --start-point is the canonical flag; --branch-start-point is an alias.
# Thresholds are sent so the dashboard can record alerts. --error-on-alert / --err
# is intentionally omitted: a regression must not fail this job. The upload step
# is continue-on-error so a Bencher outage does not fail the job either.
# This workflow is not a pull request check and is not a required status check.
# The c_sharp_dot_net adapter reads BenchmarkDotNet JSON (--exporters json)
# and names each benchmark "{Namespace}.{Method}". It ignores Parameters, so
# this job appends a non-empty Parameters string to Method before upload.
# That keeps CascadeScaleBench Rows=100000 and Rows=200000 as separate series
# without changing what BenchmarkDotNet measures.
#
# Default BenchmarkDotNet job (no Short/Dry). CascadeScaleBench matches
# 100k and 200k rows, so a run can be long. timeout-minutes is the Actions
# maximum of 360.
name: Benchmarks

on:
  push:
    branches: [dev, main]
    paths:
      - "RecDiffy.NET/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobbler1-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark
    runs-on: [self-hosted, cobbler1-bench]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
        working-directory: RecDiffy.NET/src/RecDiffy.Benchmarks
    env:
      BENCH_BRANCH: ${{ github.ref_name }}
      BENCH_SHA: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify .NET SDK
        run: |
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed with exit code $LASTEXITCODE" }

      - name: Verify Bencher CLI
        run: |
          bencher --version
          if ($LASTEXITCODE -ne 0) { throw "bencher --version failed with exit code $LASTEXITCODE" }

      - name: Clean BenchmarkDotNet artifacts
        run: |
          $artifacts = Join-Path (Get-Location) 'BenchmarkDotNet.Artifacts'
          if (Test-Path -LiteralPath $artifacts) {
            Remove-Item -LiteralPath $artifacts -Recurse -Force
          }

      - name: Run benchmarks
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run -c Release -- --filter '*' --exporters json --artifacts .\BenchmarkDotNet.Artifacts
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet run failed with exit code $LASTEXITCODE"
          }

      - name: Upload to Bencher
        continue-on-error: true
        env:
          BENCHER_HOST: ${{ secrets.BENCHER_HOST }}
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BENCHER_HOST)) { throw 'BENCHER_HOST secret is empty.' }
          if ([string]::IsNullOrWhiteSpace($env:BENCHER_API_TOKEN)) { throw 'BENCHER_API_TOKEN secret is empty.' }

          function ConvertTo-BencherJson([object]$Value) {
            if ($null -eq $Value) { return 'null' }
            if ($Value -is [string]) { return ($Value | ConvertTo-Json -Compress) }
            if ($Value -is [bool]) { if ($Value) { return 'true' } else { return 'false' } }
            $culture = [System.Globalization.CultureInfo]::InvariantCulture
            if ($Value -is [sbyte] -or $Value -is [byte] -or $Value -is [int16] -or $Value -is [uint16] -or $Value -is [int32] -or $Value -is [uint32] -or $Value -is [int64] -or $Value -is [uint64]) {
              return [System.Convert]::ToString($Value, $culture)
            }
            # Whole-valued floats must stay JSON integers. The adapter reads
            # MemoryDiagnoser counters as integers, and serde rejects 184.0.
            if ($Value -is [single] -or $Value -is [double] -or $Value -is [decimal]) {
              $asDecimal = [decimal]$Value
              if ($asDecimal -eq [decimal]::Truncate($asDecimal)) {
                return [System.Convert]::ToString([decimal]::Truncate($asDecimal), $culture)
              }
              return [System.Convert]::ToString($Value, $culture)
            }
            if ($Value -is [System.Management.Automation.PSCustomObject]) {
              $props = New-Object System.Collections.Generic.List[string]
              foreach ($prop in $Value.PSObject.Properties) {
                $name = $prop.Name | ConvertTo-Json -Compress
                $props.Add(('{0}:{1}' -f $name, (ConvertTo-BencherJson $prop.Value)))
              }
              return '{' + ($props -join ',') + '}'
            }
            if ($Value -is [System.Collections.IEnumerable]) {
              $items = New-Object System.Collections.Generic.List[string]
              foreach ($item in $Value) { $items.Add((ConvertTo-BencherJson $item)) }
              return '[' + ($items -join ',') + ']'
            }
            return ($Value | ConvertTo-Json -Compress)
          }

          $resultsDir = Join-Path (Get-Location) 'BenchmarkDotNet.Artifacts\results'
          $reports = @(Get-ChildItem -LiteralPath $resultsDir -Filter '*-report.json' -File | Sort-Object Name)
          if ($reports.Count -eq 0) { throw "No BenchmarkDotNet JSON reports in $resultsDir" }

          $combined = $null
          $benchmarks = New-Object System.Collections.Generic.List[object]
          foreach ($report in $reports) {
            Write-Host "Reading $($report.FullName)"
            $doc = Get-Content -Raw -LiteralPath $report.FullName | ConvertFrom-Json
            if ($null -eq $combined) { $combined = $doc }
            foreach ($benchmark in @($doc.Benchmarks)) {
              $parameters = [string]$benchmark.Parameters
              if (-not [string]::IsNullOrWhiteSpace($parameters)) {
                $benchmark.Method = '{0}({1})' -f [string]$benchmark.Method, $parameters
              }
              $stats = $benchmark.Statistics
              if ($null -eq $stats) { throw "Missing Statistics in $($report.Name) method $($benchmark.Method)" }
              foreach ($field in @('Mean', 'StandardDeviation', 'Median', 'InterquartileRange')) {
                if ($null -eq $stats.PSObject.Properties[$field]) {
                  throw "Missing Statistics.$field in $($report.Name) method $($benchmark.Method)"
                }
              }
              $benchmarks.Add($benchmark)
            }
          }
          if ($benchmarks.Count -eq 0) { throw 'BenchmarkDotNet reports contained no benchmarks.' }

          $names = foreach ($benchmark in $benchmarks) {
            $method = [string]$benchmark.Method
            $namespace = [string]$benchmark.Namespace
            if ([string]::IsNullOrWhiteSpace($namespace)) { $method } else { "$namespace.$method" }
          }
          $duplicates = @($names | Group-Object | Where-Object { $_.Count -gt 1 })
          if ($duplicates.Count -gt 0) {
            throw ("Duplicate Bencher benchmark names: " + (($duplicates | ForEach-Object { $_.Name }) -join ', '))
          }
          Write-Host 'Bencher benchmark names:'
          $names | ForEach-Object { Write-Host "  $_" }

          $combined.Benchmarks = $benchmarks.ToArray()
          $out = Join-Path (Get-Location) 'BenchmarkDotNet.Artifacts\bencher-report.json'
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($out, (ConvertTo-BencherJson $combined), $utf8)
          Write-Host "Wrote $out"

          $bencherArgs = @(
            'run',
            '--project', 'recdiffy',
            '--host', $env:BENCHER_HOST,
            '--token', $env:BENCHER_API_TOKEN,
            '--branch', $env:BENCH_BRANCH,
            '--hash', $env:BENCH_SHA,
            '--testbed', 'cobbler1',
            '--adapter', 'c_sharp_dot_net',
            '--threshold-measure', 'latency',
            '--threshold-test', 't_test',
            '--threshold-max-sample-size', '64',
            '--threshold-upper-boundary', '0.99',
            '--thresholds-reset',
            '--format', 'json',
            '--quiet',
            '--file', $out
          )
          # dev is tracked from main. Other refs (including workflow_dispatch
          # on a topic branch) upload as their own branch with the same threshold.
          # No --error-on-alert: Bencher still stores alerts, and this step does not fail for them.
          if ($env:BENCH_BRANCH -eq 'dev') {
            $bencherArgs += @('--start-point', 'main', '--start-point-clone-thresholds')
          }

          $invokeError = $null
          $bencherExit = 0
          $stdout = ''
          $stderr = ''
          try {
            $command = Get-Command bencher -ErrorAction Stop
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $command.Source
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $true
            # Windows PowerShell 5.1 runs on .NET Framework, which may not have these properties.
            $utf8Encoding = New-Object System.Text.UTF8Encoding $false
            $stdoutEncoding = $psi.GetType().GetProperty('StandardOutputEncoding')
            $stderrEncoding = $psi.GetType().GetProperty('StandardErrorEncoding')
            if ($stdoutEncoding) { $stdoutEncoding.SetValue($psi, $utf8Encoding, $null) }
            if ($stderrEncoding) { $stderrEncoding.SetValue($psi, $utf8Encoding, $null) }
            $quoted = foreach ($arg in $bencherArgs) {
              if ($null -eq $arg) { '""' }
              elseif ($arg -match '[\s"]') { '"' + ($arg -replace '"', '\"') + '"' }
              else { $arg }
            }
            $psi.Arguments = $quoted -join ' '
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            [void]$process.Start()
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $stdout = $stdoutTask.Result
            $stderr = $stderrTask.Result
            $bencherExit = $process.ExitCode
          } catch {
            $invokeError = $_.Exception.Message
            $bencherExit = 1
          }

          function Redact([string]$text) {
            if ([string]::IsNullOrEmpty($text)) { return '' }
            if (-not [string]::IsNullOrEmpty($env:BENCHER_API_TOKEN)) {
              $text = $text.Replace($env:BENCHER_API_TOKEN, '***')
            }
            return $text
          }

          $stderr = Redact $stderr
          $stdout = Redact $stdout
          if (-not [string]::IsNullOrWhiteSpace($stderr)) {
            Write-Host $stderr
          }

          $report = $null
          $parsed = $false
          if (-not [string]::IsNullOrWhiteSpace($stdout)) {
            try {
              $report = $stdout | ConvertFrom-Json
              $parsed = $true
            } catch {
              $report = $null
            }
          }

          $dashboard = 'https://bench.cobblerhill.net/perf/recdiffy'
          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add('## Bencher')
          $summary.Add('')
          $summary.Add('Informational only. Alerts are recorded on the dashboard and do not fail this job.')
          $summary.Add('')
          $summary.Add("[recdiffy benchmarks]($dashboard)")
          $summary.Add('')
          $summary.Add(('Branch `{0}`, testbed `cobbler1`.' -f $env:BENCH_BRANCH))

          if ($bencherExit -ne 0 -or $invokeError) {
            $summary.Add('')
            $summary.Add('Upload did not succeed. The dashboard was not updated by this run. This step does not fail the job.')
            if ($invokeError) { $summary.Add(''); $summary.Add((Redact $invokeError)) }
            $tail = @($stderr -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Last 15)
            if ($tail.Count -gt 0) {
              $summary.Add('')
              $summary.Add('```')
              foreach ($line in $tail) { $summary.Add($line) }
              $summary.Add('```')
            }
          } else {
            $summary.Add('')
            if (-not $parsed) {
              $summary.Add('Upload succeeded. Alert details were not parsed from the report; see the dashboard.')
            } else {
              $alertTotal = 0
              if ($report.counts -and $report.counts.alerts) {
                $alertTotal = [int]$report.counts.alerts.total
              }
              $alertRows = @()
              if ($report.alerts) { $alertRows = @($report.alerts) }
              if ($alertTotal -eq 0) {
                $summary.Add('No alerts.')
              } else {
                $summary.Add("$alertTotal alert(s).")
                $summary.Add('')
                $summary.Add('| Benchmark | Status | Value |')
                $summary.Add('| --- | --- | --- |')
                $shown = 0
                foreach ($alert in $alertRows) {
                  if ($null -eq $alert -or $shown -ge 30) { continue }
                  $name = [string]$alert.benchmark.name
                  $status = [string]$alert.status
                  $value = [string]$alert.value
                  $name = $name -replace '\|', '/' -replace '\r|\n', ' '
                  $status = $status -replace '\|', '/' -replace '\r|\n', ' '
                  $value = $value -replace '\|', '/' -replace '\r|\n', ' '
                  $summary.Add("| $name | $status | $value |")
                  $shown++
                }
                $hidden = $alertTotal - $shown
                if ($hidden -gt 0) {
                  $summary.Add('')
                  $summary.Add("$hidden more alert(s) are on the dashboard.")
                }
              }
            }
          }

          $summaryPath = $env:GITHUB_STEP_SUMMARY
          if (-not [string]::IsNullOrWhiteSpace($summaryPath)) {
            $summaryEncoding = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($summaryPath, (($summary -join "`n") + "`n"), $summaryEncoding)
          }

          if ($bencherExit -ne 0 -or $invokeError) {
            throw "bencher run failed with exit code $bencherExit. The upload step continues on error, so this does not fail the job."
          }
