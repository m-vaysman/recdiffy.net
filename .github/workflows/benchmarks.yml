# Continuous benchmarks on the dedicated COBBLER1 runner.
# No pull_request or pull_request_target: this repo is public and the runner
# is self-hosted, so untrusted fork code must never execute on COBBLER1.
# Push to dev/main and workflow_dispatch only.
#
# Bencher CLI 0.6.x (installed on the runner, not in this job):
# --start-point is the canonical flag; --branch-start-point is an alias.
# Thresholds are sent so the dashboard can record alerts. --error-on-alert / --err
# is intentionally omitted: a regression must not fail this job. The upload step
# is continue-on-error so a Bencher outage does not fail the job either.
# This workflow is not a pull request check and is not a required status check.
# BenchmarkDotNet 0.15 --exporters json writes *-report-full-compressed.json.
# BmfReport reads that file (and older *-report.json names) into one Bencher
# Metric Format upload, so latency, allocated-bytes, gen collections, and
# throughput share one report. The converter keeps Rows and degree in the name.
# Conversion and upload are continue-on-error: a converter or Bencher failure
# is recorded in the job summary and does not fail the job.
#
# Scaled benches use BenchScale (1_000 and 4_000 rows per side) and one warmup
# plus three target iterations. timeout-minutes is the Actions maximum of 360.
name: Benchmarks

on:
  push:
    branches: [dev, main]
    paths:
      - "RecDiffy.NET/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobbler1-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark
    runs-on: [self-hosted, cobbler1-bench]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
        working-directory: RecDiffy.NET/src/RecDiffy.Benchmarks
    env:
      BENCH_BRANCH: ${{ github.ref_name }}
      BENCH_SHA: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify .NET SDK
        run: |
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed with exit code $LASTEXITCODE" }

      - name: Verify Bencher CLI
        run: |
          bencher --version
          if ($LASTEXITCODE -ne 0) { throw "bencher --version failed with exit code $LASTEXITCODE" }

      - name: Clean BenchmarkDotNet artifacts
        run: |
          $artifacts = Join-Path (Get-Location) 'BenchmarkDotNet.Artifacts'
          if (Test-Path -LiteralPath $artifacts) {
            Remove-Item -LiteralPath $artifacts -Recurse -Force
          }

      - name: Run benchmarks
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = Join-Path (Get-Location) 'BenchmarkDotNet.Artifacts'
          Write-Host "BenchmarkDotNet artifacts: $artifacts"
          dotnet run -c Release -- --filter '*' --exporters json --artifacts "$artifacts"
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet run failed with exit code $LASTEXITCODE"
          }

      - name: Write Bencher metric report
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          function Add-JobSummary([string]$markdown) {
            $summaryPath = $env:GITHUB_STEP_SUMMARY
            if ([string]::IsNullOrWhiteSpace($summaryPath)) { return }
            $encoding = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($summaryPath, ($markdown.TrimEnd() + "`n"), $encoding)
          }
          $artifacts = Join-Path (Get-Location) 'BenchmarkDotNet.Artifacts'
          $results = Join-Path $artifacts 'results'
          $bmf = Join-Path $artifacts 'bencher.bmf.json'
          Write-Host "BenchmarkDotNet artifacts: $artifacts"
          Write-Host "BenchmarkDotNet results: $results"
          & dotnet run -c Release --no-build -- --bmf "$results" "$bmf"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $bmf)) {
            $listing = if (Test-Path -LiteralPath $results) {
              @(Get-ChildItem -LiteralPath $results -Force | ForEach-Object { $_.FullName }) -join "`n"
            } elseif (Test-Path -LiteralPath $artifacts) {
              "results directory is missing.`n" + (@(Get-ChildItem -LiteralPath $artifacts -Recurse -Force | ForEach-Object { $_.FullName }) -join "`n")
            } else {
              "artifacts directory is missing: $artifacts"
            }
            if ([string]::IsNullOrWhiteSpace($listing)) { $listing = '(empty directory)' }
            $markdown = @(
              '## Bencher metric report'
              ''
              "Conversion failed (exit $LASTEXITCODE). The upload is skipped. This step does not fail the job."
              ''
              $results
              ''
              '```'
              $listing
              '```'
            ) -join "`n"
            Add-JobSummary $markdown
            throw "BMF conversion failed with exit code $LASTEXITCODE"
          }

      - name: Upload to Bencher
        continue-on-error: true
        env:
          BENCHER_HOST: ${{ secrets.BENCHER_HOST }}
          # The repo secret is still BENCHER_API_TOKEN. Bencher 0.6.16 rejects that
          # value on --token because it is an API key, so the CLI receives it as --key.
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # --key and --token are mutually exclusive, including via the environment.
          Remove-Item Env:BENCHER_API_TOKEN -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($env:BENCHER_HOST)) { throw 'BENCHER_HOST secret is empty.' }
          if ([string]::IsNullOrWhiteSpace($env:BENCHER_API_KEY)) { throw 'Repo secret BENCHER_API_TOKEN is empty.' }

          foreach ($measure in @(
              @{ Name = 'Allocated bytes'; Slug = 'allocated-bytes'; Units = 'bytes/op' },
              @{ Name = 'Gen0 collections'; Slug = 'gen0-collections'; Units = 'collections/op' },
              @{ Name = 'Gen1 collections'; Slug = 'gen1-collections'; Units = 'collections/op' },
              @{ Name = 'Gen2 collections'; Slug = 'gen2-collections'; Units = 'collections/op' }
            )) {
            & bencher measure create recdiffy --name $measure.Name --slug $measure.Slug --units $measure.Units --host $env:BENCHER_HOST --key $env:BENCHER_API_KEY
            if ($LASTEXITCODE -ne 0) {
              Write-Host "measure create $($measure.Slug) exited $LASTEXITCODE; keeping an existing measure or letting the report create it."
            }
          }

          $out = Join-Path (Get-Location) 'BenchmarkDotNet.Artifacts\bencher.bmf.json'
          if (-not (Test-Path -LiteralPath $out)) {
            $summaryPath = $env:GITHUB_STEP_SUMMARY
            if (-not [string]::IsNullOrWhiteSpace($summaryPath)) {
              $encoding = New-Object System.Text.UTF8Encoding $false
              [System.IO.File]::AppendAllText($summaryPath, "## Bencher`n`nUpload skipped. ``$out`` was not written.`n", $encoding)
            }
            Write-Host "Bencher upload skipped; $out was not written."
            exit 0
          }

          $bencherArgs = @(
            'run',
            '--project', 'recdiffy',
            '--host', $env:BENCHER_HOST,
            '--key', $env:BENCHER_API_KEY,
            '--branch', $env:BENCH_BRANCH,
            '--hash', $env:BENCH_SHA,
            '--testbed', 'cobbler1',
            '--adapter', 'json',
            '--threshold-measure', 'latency',
            '--threshold-test', 't_test',
            '--threshold-max-sample-size', '64',
            '--threshold-lower-boundary', '_',
            '--threshold-upper-boundary', '0.99',
            '--threshold-measure', 'allocated-bytes',
            '--threshold-test', 't_test',
            '--threshold-max-sample-size', '64',
            '--threshold-lower-boundary', '_',
            '--threshold-upper-boundary', '0.99',
            '--threshold-measure', 'throughput',
            '--threshold-test', 't_test',
            '--threshold-max-sample-size', '64',
            '--threshold-lower-boundary', '0.99',
            '--threshold-upper-boundary', '_',
            '--thresholds-reset',
            '--format', 'json',
            '--quiet',
            '--file', $out
          )
          # dev is tracked from main. Other refs (including workflow_dispatch
          # on a topic branch) upload as their own branch with the same threshold.
          # No --error-on-alert: Bencher still stores alerts, and this step does not fail for them.
          if ($env:BENCH_BRANCH -eq 'dev') {
            $bencherArgs += @('--start-point', 'main', '--start-point-clone-thresholds')
          }

          $invokeError = $null
          $bencherExit = 0
          $stdout = ''
          $stderr = ''
          try {
            $command = Get-Command bencher -ErrorAction Stop
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $command.Source
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $true
            # Windows PowerShell 5.1 runs on .NET Framework, which may not have these properties.
            $utf8Encoding = New-Object System.Text.UTF8Encoding $false
            $stdoutEncoding = $psi.GetType().GetProperty('StandardOutputEncoding')
            $stderrEncoding = $psi.GetType().GetProperty('StandardErrorEncoding')
            if ($stdoutEncoding) { $stdoutEncoding.SetValue($psi, $utf8Encoding, $null) }
            if ($stderrEncoding) { $stderrEncoding.SetValue($psi, $utf8Encoding, $null) }
            $quoted = foreach ($arg in $bencherArgs) {
              if ($null -eq $arg) { '""' }
              elseif ($arg -match '[\s"]') { '"' + ($arg -replace '"', '\"') + '"' }
              else { $arg }
            }
            $psi.Arguments = $quoted -join ' '
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            [void]$process.Start()
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $stdout = $stdoutTask.Result
            $stderr = $stderrTask.Result
            $bencherExit = $process.ExitCode
          } catch {
            $invokeError = $_.Exception.Message
            $bencherExit = 1
          }

          function Redact([string]$text) {
            if ([string]::IsNullOrEmpty($text)) { return '' }
            if (-not [string]::IsNullOrEmpty($env:BENCHER_API_KEY)) {
              $text = $text.Replace($env:BENCHER_API_KEY, '***')
            }
            return $text
          }

          $stderr = Redact $stderr
          $stdout = Redact $stdout
          if (-not [string]::IsNullOrWhiteSpace($stderr)) {
            Write-Host $stderr
          }

          $report = $null
          $parsed = $false
          if (-not [string]::IsNullOrWhiteSpace($stdout)) {
            try {
              $report = $stdout | ConvertFrom-Json
              $parsed = $true
            } catch {
              $report = $null
            }
          }

          $dashboard = 'https://bench.cobblerhill.net/perf/recdiffy'
          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add('## Bencher')
          $summary.Add('')
          $summary.Add('Informational only. Latency, allocated bytes, and throughput alerts are recorded on the dashboard and do not fail this job.')
          $summary.Add('')
          $summary.Add("[recdiffy benchmarks]($dashboard)")
          $summary.Add('')
          $summary.Add(('Branch `{0}`, testbed `cobbler1`.' -f $env:BENCH_BRANCH))

          if ($bencherExit -ne 0 -or $invokeError) {
            $summary.Add('')
            $summary.Add('Upload did not succeed. The dashboard was not updated by this run. This step does not fail the job.')
            if ($invokeError) { $summary.Add(''); $summary.Add((Redact $invokeError)) }
            $tail = @($stderr -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Last 15)
            if ($tail.Count -gt 0) {
              $summary.Add('')
              $summary.Add('```')
              foreach ($line in $tail) { $summary.Add($line) }
              $summary.Add('```')
            }
          } else {
            $summary.Add('')
            if (-not $parsed) {
              $summary.Add('Upload succeeded. Alert details were not parsed from the report; see the dashboard.')
            } else {
              $alertTotal = 0
              if ($report.counts -and $report.counts.alerts) {
                $alertTotal = [int]$report.counts.alerts.total
              }
              $alertRows = @()
              if ($report.alerts) { $alertRows = @($report.alerts) }
              if ($alertTotal -eq 0) {
                $summary.Add('No alerts.')
              } else {
                $summary.Add("$alertTotal alert(s).")
                $summary.Add('')
                $summary.Add('| Benchmark | Measure | Status | Value |')
                $summary.Add('| --- | --- | --- | --- |')
                $shown = 0
                foreach ($alert in $alertRows) {
                  if ($null -eq $alert -or $shown -ge 30) { continue }
                  $name = [string]$alert.benchmark.name
                  $measureName = [string]$alert.threshold.measure.name
                  if ([string]::IsNullOrWhiteSpace($measureName)) { $measureName = [string]$alert.threshold.measure.slug }
                  $status = [string]$alert.status
                  $value = [string]$alert.value
                  $measureName = $measureName -replace '\|', '/' -replace '\r|\n', ' '
                  $name = $name -replace '\|', '/' -replace '\r|\n', ' '
                  $status = $status -replace '\|', '/' -replace '\r|\n', ' '
                  $value = $value -replace '\|', '/' -replace '\r|\n', ' '
                  $summary.Add("| $name | $measureName | $status | $value |")
                  $shown++
                }
                $hidden = $alertTotal - $shown
                if ($hidden -gt 0) {
                  $summary.Add('')
                  $summary.Add("$hidden more alert(s) are on the dashboard.")
                }
              }
            }
          }

          $summaryPath = $env:GITHUB_STEP_SUMMARY
          if (-not [string]::IsNullOrWhiteSpace($summaryPath)) {
            $summaryEncoding = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($summaryPath, (($summary -join "`n") + "`n"), $summaryEncoding)
          }

          if ($bencherExit -ne 0 -or $invokeError) {
            throw "bencher run failed with exit code $bencherExit. The upload step continues on error, so this does not fail the job."
          }
