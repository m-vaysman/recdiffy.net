name: Public data demo

# Every weekday at 6:30 pm US Eastern: download the last 30 days of FINRA short-sale volume and US Treasury
# debt data, reconcile them with RecDiffy.NET, and publish the page to GitHub Pages. Nothing is committed:
# the downloads live only on the runner, and the page is deployed straight from the build. If a source is
# down the run fails before deploying, so the previous page stays up.

on:
  schedule:
    # GitHub's cron is UTC only, so both offsets are scheduled and the gate below keeps the one that is
    # 6:30 pm in New York that day: 22:30 UTC under daylight saving time (UTC-4), 23:30 UTC otherwise (UTC-5).
    - cron: '30 22 * * 1-5'
    - cron: '30 23 * * 1-5'
  # A release that changes the demo republishes it straight away.
  push:
    branches: [main]
    paths:
      - RecDiffy.NET/src/RecDiffy.PublicDataDemo/**
      - RecDiffy.NET/src/RecDiffy.BrowserDemo/**
      - .github/workflows/public-data-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # GitHub switches off scheduled workflows in a public repo after 60 days with no activity; re-enabling
      # this workflow on every run keeps the schedule alive through quiet months.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/public-data-demo.yml/enable"

      - name: Run only at 6:30 pm New York time
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)
          case "$SCHEDULE|$offset" in
            "|"*) run=true ;;
            "30 22 * * 1-5|-0400") run=true ;;
            "30 23 * * 1-5|-0500") run=true ;;
            *) run=false ;;
          esac
          echo "Schedule '$SCHEDULE', New York offset $offset: run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: RecDiffy.NET/global.json

      - name: Reconcile and build the page
        run: >-
          dotnet run --project RecDiffy.NET/src/RecDiffy.PublicDataDemo -c Release
          -p:InformationalVersion="${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          -- site 30

      # The Blazor browser demo, under /try/. Its base path is rewritten for the project site
      # (/recdiffy.net/try/), and the step fails if the rewrite did not happen. GitHub Pages compresses on its
      # own, so the precompressed copies are dropped.
      - name: Publish the browser demo under /try/
        run: |
          dotnet publish RecDiffy.NET/src/RecDiffy.BrowserDemo -c Release -o browser-demo
          mkdir -p site/try
          cp -r browser-demo/wwwroot/. site/try/
          find site/try \( -name '*.br' -o -name '*.gz' \) -delete
          base="/${GITHUB_REPOSITORY#*/}/try/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" site/try/index.html
          grep -q "<base href=\"$base\" />" site/try/index.html
          touch site/.nojekyll

      - name: Upload the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
