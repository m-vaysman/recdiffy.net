# T4 (#312): Nightly Stryker.NET mutation testing on Matching, Consolidation, Diff, and ProfileCompiler.
# Informational only — runs off the PR path and never fails the workflow.
name: Mutation Testing

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Routing is decided per run by .github/workflows/pick-runner.yml.
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    with:
      hosted_fallback: ubuntu-latest

  # Self-hosted first. Every step is dotnet: install the tool, then run Stryker against
  # the same project, test project, framework and mutate patterns. Both run steps are
  # bash and say so, which is already how ubuntu-latest runs them, so nothing about the
  # run changes. The tool goes on PATH through $HOME, which dotnet resolves to the same
  # tools folder on Windows, so the next step finds dotnet-stryker.
  #
  # It takes up to two hours and the box has one slot, so it can queue behind
  # benchmarks.yml, or they behind it. The pick only answers the self-hosted runner when
  # it is idle, so a busy box sends this to ubuntu-latest instead.
  mutate:
    name: Stryker.NET
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on_json) }}
    continue-on-error: true
    timeout-minutes: 120
    defaults:
      run:
        working-directory: RecDiffy.NET
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: RecDiffy.NET/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RecDiffy.NET/**/*.csproj', 'RecDiffy.NET/**/*.props', 'RecDiffy.NET/**/*.targets', 'RecDiffy.NET/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Stryker.NET
        shell: bash
        run: |
          dotnet tool install --global dotnet-stryker
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run Stryker.NET
        continue-on-error: true
        # bash on both machines: the arguments below use trailing backslash
        # continuations, which is already how ubuntu-latest runs this step.
        shell: bash
        # Run outside RecDiffy.NET so Stryker does not enter solution context
        # (RecDiffy.slnx lives there) and abort with zero mutants tested.
        working-directory: RecDiffy.NET/src/RecDiffy
        run: |
          dotnet stryker \
            --project "RecDiffy.csproj" \
            --test-project "../RecDiffy.Tests/RecDiffy.Tests.csproj" \
            --target-framework net10.0 \
            --mutate "Matching/**/*.cs" \
            --mutate "Consolidation/**/*.cs" \
            --mutate "Diff/**/*.cs" \
            --mutate "Profile/ProfileCompiler.cs" \
            --reporter html \
            --reporter json \
            --reporter cleartext \
            --output "../../StrykerOutput"

      - name: Upload Stryker report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stryker-mutation-report
          path: RecDiffy.NET/StrykerOutput/**
          if-no-files-found: ignore
