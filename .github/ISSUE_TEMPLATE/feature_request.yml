name: Feature request
description: Suggest a new rule, reader, report or add-in feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem first. A design is optional.

        **Use synthetic data only.** Never paste or attach real client files, names, account numbers or trade IDs.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which part would change? Pick all that apply.
      multiple: true
      options:
        - RecDiffy
        - RecDiffy.IO
        - RecDiffy.Excel (the report writer)
        - RecDiffy.RulePacks.Trading
        - Excel add-in
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to reconcile, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: What RecDiffy should do. For a new rule, give the name a profile would use and what the rule does to a value.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: Example
      description: A small synthetic example. A few rows per side, and the result you'd expect.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The data in this request is synthetic. It has no real client files, names, account numbers or trade IDs.
          required: true
        - label: I searched the open issues, and this isn't requested yet.
          required: true
