<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The two finance input files side by side: the broker's CSV of confirmations and the blotter workbook's Trades sheet, with differences highlighted</title>
  <rect width="1000" height="330" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- ===== Left card: the CSV file ===== -->
  <rect x="20" y="20" width="432" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M20,48 L20,28 Q20,20 28,20 L444,20 Q452,20 452,28 L452,48 Z" fill="#f6f8fa"/>
  <line x1="20" y1="48" x2="452" y2="48" stroke="#d0d7de"/>
  <text x="34" y="39" font-size="13" font-weight="600" fill="#1f2328">broker-confirms.csv</text>
  <text x="440" y="39" font-size="11" fill="#57606a" text-anchor="end">Left · reader 1: Sylvan.Data.Csv</text>

  <!-- row tints -->
  <rect x="21" y="102" width="430" height="26" fill="#fff8c5"/>
  <rect x="21" y="128" width="430" height="26" fill="#ffebe9"/>
  <rect x="21" y="154" width="430" height="26" fill="#ffebe9"/>
  <rect x="21" y="180" width="430" height="26" fill="#fbefff"/>
  <rect x="21" y="102" width="4" height="26" fill="#d4a72c"/>
  <rect x="21" y="128" width="4" height="52" fill="#cf222e"/>
  <rect x="21" y="180" width="4" height="26" fill="#8250df"/>

  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#1f2328">
    <text x="34" y="68" fill="#57606a">ConfirmId,TradeRef,TradeDate,ISIN,Side,Quantity,Price,NetAmount</text>
    <text x="34" y="94">C-1001,T-5001,2026-11-05,US0378331005,B,1000,189.25,189250.00</text>
    <text x="34" y="120">C-1002,T-5002,2026-11-05,US5949181045,S,500,412.10,<tspan fill="#9a6700" font-weight="700">206050.00</tspan></text>
    <text x="34" y="146">C-1003,T-5003,2026-11-05,US88160R1014,B,<tspan fill="#cf222e" font-weight="700">250</tspan>,245.80,<tspan fill="#cf222e" font-weight="700">61450.00</tspan></text>
    <text x="34" y="172">C-1004,<tspan fill="#cf222e" font-weight="700">,</tspan>2026-11-05,US02079K3059,B,300,171.55,51465.00</text>
    <text x="34" y="198">C-1005,T-5007,2026-11-05,US0231351067,S,120,201.40,24168.00</text>
  </g>
  <text x="34" y="236" font-size="11.5" fill="#57606a">Every cell is text. Dates are ISO strings; numbers keep their zeros.</text>
  <text x="34" y="254" font-size="11.5" fill="#57606a">C-1004 has no trade ref: the field after C-1004 is empty.</text>

  <!-- ===== Right card: the workbook ===== -->
  <rect x="470" y="20" width="510" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M470,48 L470,28 Q470,20 478,20 L972,20 Q980,20 980,28 L980,48 Z" fill="#f6f8fa"/>
  <line x1="470" y1="48" x2="980" y2="48" stroke="#d0d7de"/>
  <text x="484" y="39" font-size="13" font-weight="600" fill="#1f2328">blotter.xlsx</text>
  <text x="968" y="39" font-size="11" fill="#57606a" text-anchor="end">Right · reader 2: Sylvan.Data.Excel</text>

  <!-- column letters -->
  <rect x="482" y="58" width="490" height="18" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-size="10" fill="#57606a" text-anchor="middle">
    <text x="535" y="71">A</text><text x="603" y="71">B</text><text x="692" y="71">C</text><text x="760" y="71">D</text>
    <text x="798" y="71">E</text><text x="847" y="71">F</text><text x="923" y="71">G</text>
  </g>

  <!-- row tints (data rows 2..6) -->
  <rect x="504" y="124" width="468" height="24" fill="#fff8c5"/>
  <rect x="504" y="148" width="468" height="48" fill="#ffebe9"/>
  <rect x="504" y="196" width="468" height="24" fill="#fbefff"/>

  <!-- grid -->
  <g stroke="#d0d7de" fill="none">
    <rect x="482" y="76" width="490" height="144"/>
    <line x1="504" y1="58" x2="504" y2="220"/>
    <line x1="566" y1="58" x2="566" y2="220"/>
    <line x1="640" y1="58" x2="640" y2="220"/>
    <line x1="744" y1="58" x2="744" y2="220"/>
    <line x1="776" y1="58" x2="776" y2="220"/>
    <line x1="820" y1="58" x2="820" y2="220"/>
    <line x1="874" y1="58" x2="874" y2="220"/>
    <line x1="482" y1="100" x2="972" y2="100"/>
    <line x1="482" y1="124" x2="972" y2="124"/>
    <line x1="482" y1="148" x2="972" y2="148"/>
    <line x1="482" y1="172" x2="972" y2="172"/>
    <line x1="482" y1="196" x2="972" y2="196"/>
  </g>
  <rect x="482" y="76" width="22" height="144" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-size="10" fill="#57606a" text-anchor="middle">
    <text x="493" y="92">1</text><text x="493" y="116">2</text><text x="493" y="140">3</text>
    <text x="493" y="164">4</text><text x="493" y="188">5</text><text x="493" y="212">6</text>
  </g>

  <!-- header row -->
  <g font-size="10.5" font-weight="600" fill="#1f2328">
    <text x="509" y="92">Trade ID</text><text x="571" y="92">Exec Date</text><text x="645" y="92">ISIN</text>
    <text x="749" y="92">B/S</text><text x="781" y="92">Qty</text><text x="825" y="92">Avg Px</text><text x="879" y="92">Net Consideration</text>
  </g>

  <!-- data rows: text left, numbers and dates right -->
  <g font-size="10.5" fill="#1f2328">
    <text x="509" y="116">T-5001</text><text x="645" y="116">US0378331005</text><text x="749" y="116">B</text>
    <text x="509" y="140">T-5002</text><text x="645" y="140">US5949181045</text><text x="749" y="140">S</text>
    <text x="509" y="164">T-5003</text><text x="645" y="164">US88160R1014</text><text x="749" y="164">B</text>
    <text x="509" y="188">T-5004</text><text x="645" y="188">US02079K3059</text><text x="749" y="188">B</text>
    <text x="509" y="212">T-5006</text><text x="645" y="212">US67066G1040</text><text x="749" y="212">B</text>
  </g>
  <g font-size="10.5" fill="#1f2328" text-anchor="end">
    <text x="635" y="116">11/5/2026</text><text x="815" y="116">1000</text><text x="869" y="116">189.25</text><text x="967" y="116">189250</text>
    <text x="635" y="140">11/5/2026</text><text x="815" y="140">500</text><text x="869" y="140">412.1</text><text x="967" y="140" fill="#9a6700" font-weight="700">206049.99</text>
    <text x="635" y="164">11/5/2026</text><text x="815" y="164" fill="#cf222e" font-weight="700">200</text><text x="869" y="164">245.8</text><text x="967" y="164" fill="#cf222e" font-weight="700">49160</text>
    <text x="635" y="188">11/5/2026</text><text x="815" y="188">300</text><text x="869" y="188">171.55</text><text x="967" y="188">51465</text>
    <text x="635" y="212">11/5/2026</text><text x="815" y="212">80</text><text x="869" y="212">145.3</text><text x="967" y="212">11624</text>
  </g>
  <rect x="504" y="196" width="4" height="24" fill="#8250df"/>
  <rect x="504" y="124" width="4" height="24" fill="#d4a72c"/>
  <rect x="504" y="148" width="4" height="48" fill="#cf222e"/>

  <!-- sheet tab -->
  <rect x="504" y="230" width="66" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <line x1="504" y1="254" x2="570" y2="254" stroke="#1a7f37" stroke-width="3"/>
  <text x="537" y="246" font-size="11" font-weight="600" fill="#1a7f37" text-anchor="middle">Trades</text>
  <text x="586" y="246" font-size="11.5" fill="#57606a">Numbers are doubles, dates are real dates.</text>

  <!-- legend -->
  <g font-size="12" fill="#1f2328">
    <rect x="20" y="294" width="14" height="14" rx="2" fill="#fff8c5" stroke="#d4a72c"/><text x="40" y="306">Within tolerance</text>
    <rect x="170" y="294" width="14" height="14" rx="2" fill="#ffebe9" stroke="#cf222e"/><text x="190" y="306">Break</text>
    <rect x="260" y="294" width="14" height="14" rx="2" fill="#fbefff" stroke="#8250df"/><text x="280" y="306">Only on one side</text>
    <rect x="410" y="294" width="14" height="14" rx="2" fill="#ffffff" stroke="#d0d7de"/><text x="430" y="306">Exact match</text>
  </g>
</svg>
