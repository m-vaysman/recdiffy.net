<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How RecBuilder works: two readers produce your objects, RecBuilder matches and compares them, and RecResult hands your objects back sorted into buckets</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1000" height="270" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Left: two readers -->
  <text x="24" y="30" font-size="12" font-weight="600" fill="#57606a" letter-spacing="1">LEFT</text>
  <rect x="24" y="40" width="250" height="78" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="66" font-size="14" font-weight="600" fill="#1f2328">broker-confirms.csv</text>
  <text x="40" y="88" font-size="12" fill="#57606a" font-family="Consolas, Menlo, monospace">CsvDataReader</text>
  <text x="40" y="106" font-size="12" fill="#57606a">→ BrokerConfirm objects</text>

  <text x="24" y="152" font-size="12" font-weight="600" fill="#57606a" letter-spacing="1">RIGHT</text>
  <rect x="24" y="162" width="250" height="78" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="188" font-size="14" font-weight="600" fill="#1f2328">blotter.xlsx</text>
  <text x="40" y="210" font-size="12" fill="#57606a" font-family="Consolas, Menlo, monospace">ExcelDataReader</text>
  <text x="40" y="228" font-size="12" fill="#57606a">→ BlotterTrade objects</text>

  <!-- Arrows into the builder -->
  <path d="M274,79 C300,79 300,105 326,105" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M274,201 C300,201 300,175 326,175" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Center: the builder -->
  <rect x="330" y="40" width="370" height="200" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="348" y="68" font-size="14" font-weight="600" fill="#0a3069" font-family="Consolas, Menlo, monospace">RecBuilder.Between(left, right)</text>
  <g font-size="12.5" fill="#0a3069" font-family="Consolas, Menlo, monospace">
    <text x="364" y="96">.MatchOn(trade ref)</text>
    <text x="364" y="118">.ThenMatchOn(ISIN).And(date).And(side)</text>
    <text x="364" y="140">.Compare(quantity)</text>
    <text x="364" y="162">.Compare(price, tolerance: 0.0001)</text>
    <text x="364" y="184">.Compare(net amount, tolerance: 0.01)</text>
    <text x="364" y="206">.Run()</text>
  </g>
  <text x="348" y="230" font-size="11.5" fill="#0969da">No profile JSON to write: lambdas pick the members.</text>

  <!-- Arrow out -->
  <path d="M700,140 L742,140" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right: the result -->
  <rect x="746" y="40" width="230" height="200" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="762" y="66" font-size="14" font-weight="600" fill="#1f2328" font-family="Consolas, Menlo, monospace">RecResult</text>
  <g font-size="13" fill="#1f2328">
    <circle cx="768" cy="91" r="5" fill="#1a7f37"/><text x="782" y="95">Matched</text><text x="958" y="95" text-anchor="end" font-weight="600">4</text>
    <circle cx="768" cy="117" r="5" fill="#cf222e"/><text x="782" y="121">Breaks</text><text x="958" y="121" text-anchor="end" font-weight="600">2</text>
    <circle cx="768" cy="143" r="5" fill="#9a6700"/><text x="782" y="147">Ambiguous</text><text x="958" y="147" text-anchor="end" font-weight="600">0</text>
    <circle cx="768" cy="169" r="5" fill="#8250df"/><text x="782" y="173">Left only</text><text x="958" y="173" text-anchor="end" font-weight="600">1</text>
    <circle cx="768" cy="195" r="5" fill="#8250df"/><text x="782" y="199">Right only</text><text x="958" y="199" text-anchor="end" font-weight="600">1</text>
  </g>
  <text x="762" y="228" font-size="11.5" fill="#57606a">Every bucket holds your own objects.</text>
</svg>
